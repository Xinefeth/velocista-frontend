services:
  - type: web
    name: velocista-frontend
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      # Página del celular (HU-37, HU-40): /celular sirve celular.html
      - type: rewrite
        source: /celular
        destination: /celular.html
      - type: rewrite
        source: /*
        destination: /index.html
